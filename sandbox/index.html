<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sandbox</title>
    <script>
      // Early profiler snippet: starts collecting Profiler samples before the
      // SDK is loaded. See `EARLY_PROFILER_GLOBAL_NAME` in
      // packages/browser-rum/src/domain/profiling/earlyProfilerConstants.ts.
      window._DD_RUM_EARLY_PROFILER = (function (w) {
        try {
          return {
            profiler: new w.Profiler({ sampleInterval: 10, maxBufferSize: 9000 }),
            startClocks: { relative: w.performance.now(), timeStamp: Date.now() },
          }
        } catch (e) {}
      })(window)
    </script>
    <script src="/datadog-rum.js" crossorigin></script>
    <script src="/datadog-logs.js" crossorigin></script>
    <script>
      DD_RUM.init({
        clientToken: 'xxx',
        applicationId: 'xxx',
        sessionReplaySampleRate: 100,
        profilingSampleRate: 100,
        trackResources: true,
        trackLongTasks: true,
        telemetrySampleRate: 100,
        telemetryConfigurationSampleRate: 100,
        telemetryUsageSampleRate: 100,
        enableExperimentalFeatures: [],
        proxy: '/proxy',
      })
      DD_LOGS.init({
        clientToken: 'xxx',
        telemetrySampleRate: 100,
        telemetryConfigurationSampleRate: 100,
        telemetryUsageSampleRate: 100,
        enableExperimentalFeatures: [],
        proxy: '/proxy',
      })
    </script>
  </head>

  <body></body>
</html>
