name: 'Automatically close stale issues'

on:
  schedule:
    # Runs every day at 8:00 AM CET
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      debug-only:
        description: 'Only log what would be done, without labelling, commenting on or closing anything'
        type: boolean
        default: false

permissions:
  # Needed to delete and re-save the `_state` cache that lets a run resume where the previous one stopped
  actions: write
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          # See documentation at https://github.com/actions/stale?tab=readme-ov-file#all-options
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          debug-only: ${{ inputs.debug-only || false }}
          # The default (30) is used up before the run gets through all open issues and PRs
          operations-per-run: 300

          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity.

            It will be closed if no further activity occurs within 3 days.

          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity.

            It will be closed if no further activity occurs within 7 days.

          stale-issue-label: 'stale'
          close-issue-label: 'automatically closed'
          exempt-issue-labels: 'bug,enhancement'
          days-before-issue-stale: 14
          days-before-issue-close: 3

          stale-pr-label: 'stale'
          close-pr-label: 'automatically closed'
          exempt-draft-pr: false
          days-before-pr-stale: 60
          days-before-pr-close: 7
