issuer: https://gitlab.ddbuild.io

subject_pattern: 'project_path:DataDog/browser-sdk:ref_type:branch:ref:main'

claim_pattern:
  project_path: 'DataDog/browser-sdk'
  ref_type: 'branch'
  ref: 'main'

# Used by the `release-please` GitLab job: it opens/updates the release pull request (contents,
# pull_requests), labels it (issues), and creates release tags and draft GitHub releases (contents).
permissions:
  contents: write
  pull_requests: write
  issues: write
